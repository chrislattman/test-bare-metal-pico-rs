[build]
target = "thumbv8m.main-none-eabihf"    # Adds implicit --target thumbv8m.main-none-eabihf

[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-C", "target-cpu=cortex-m33",  # Target the Cortex-M33
    "-C", "link-arg=-Tlink.x",      # Use link.x script with cortex-m-rt to lay out memory
    "-C", "link-arg=--nmagic",      # Prevent padding memory between sections to save space
]
runner = "picotool load -u -v -x -t elf"

# QEMU's mps2-an521 CPU is a Cortex-M33 without an FPU, so it needs the soft-float target
[target.thumbv8m.main-none-eabi]
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=--nmagic",
]
# In another shell: telnet localhost 5678
# Quit qemu: (qemu) quit
# Quit telnet: Ctrl + ] -> telnet> quit
runner = "qemu-system-arm -machine mps2-an521 -nographic -serial telnet:localhost:5678,server=on,wait=off -kernel"

[alias]
# cargo qemu: build in release mode and run in QEMU
qemu = ["run", "--release", "--no-default-features", "--features", "qemu", "--target", "thumbv8m.main-none-eabi"]
# cargo qemu-debug: same, but in debug mode, and halts at startup and waits for GDB on localhost:1234
# In another shell:
#   gdb-multiarch -q target/thumbv8m.main-none-eabi/debug/test-bare-metal-pico-rs
#   (gdb) target remote localhost:1234
#   (gdb) break main
#   (gdb) continue
# In another shell: telnet localhost 5678
qemu-debug = [
    "run", "--no-default-features", "--features", "qemu", "--target", "thumbv8m.main-none-eabi",
    "--config", "target.thumbv8m.main-none-eabi.runner = 'qemu-system-arm -machine mps2-an521 -nographic -serial telnet:localhost:5678,server=on,wait=off -S -s -kernel'",
]
